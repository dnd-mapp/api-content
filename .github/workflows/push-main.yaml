name: Push main

on:
    push:
        branches:
            - main

jobs:
    ci:
        name: CI
        runs-on: ubuntu-26.04
        timeout-minutes: 5
        permissions:
            contents: read
        concurrency:
            group: ${{ github.workflow }}-${{ github.ref }}
            cancel-in-progress: false
        steps:
            - name: Checkout repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Run CI checks
              uses: ./.github/actions/ci

    changes:
        name: Detect changes
        runs-on: ubuntu-26.04
        timeout-minutes: 5
        permissions:
            contents: read
        outputs:
            docker: ${{ steps.filter.outputs.docker }}
        steps:
            - name: Checkout repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            # Compares the push with the previous push to main, which for a merge commit covers the whole pull request.
            - name: Detect changes to the image
              id: filter
              uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
              with:
                  base: main
                  predicate-quantifier: some-with-excludes
                  filters: |
                      docker:
                          - src/**
                          - "!src/**/*.spec.ts"
                          - .docker/healthcheck.js
                          - package.json
                          - pnpm-lock.yaml
                          - pnpm-workspace.yaml
                          - nest-cli.json
                          - .swcrc
                          - tsconfig*.json
                          - Dockerfile
                          - .dockerignore
                          - docker-bake.hcl
                          - .github/actions/docker/**
                          - .github/workflows/push-main.yaml

    # Waits for CI, so edge only moves to a commit that passed.
    docker:
        name: Docker
        needs: [ci, changes]
        if: needs.changes.outputs.docker == 'true'
        runs-on: ubuntu-26.04
        timeout-minutes: 15
        permissions:
            contents: read
        concurrency:
            group: ${{ github.workflow }}-${{ github.job }}
            cancel-in-progress: false
        steps:
            - name: Checkout repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Build and push the image
              uses: ./.github/actions/docker
              with:
                  username: ${{ vars.DOCKERHUB_USERNAME }}
                  password: ${{ secrets.DOCKERHUB_TOKEN_WRITE }}

    tag:
        name: Tag release
        runs-on: ubuntu-26.04
        timeout-minutes: 5
        permissions: {}
        concurrency:
            group: ${{ github.workflow }}-${{ github.job }}
            cancel-in-progress: false
        steps:
            - name: Tag the release
              uses: dnd-mapp/action-tag-release@4dd5358fba157c26f18e63250502476108d9fa43 # v1.0.0
              with:
                  client-id: ${{ vars.GH_APP_CLIENT_ID }}
                  private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
