name: Changes
description: Detects whether the event changes the image or the pipeline that builds it, and the Docker Hub description

inputs:
    workflow:
        description: The path of the workflow that runs the image job, so a change to the workflow tests itself
        required: true

outputs:
    image:
        description: Whether the event changes the image, as `true` or `false`
        value: ${{ steps.filter.outputs.image }}
    description:
        description: Whether the event changes the Docker Hub description, as `true` or `false`
        value: ${{ steps.filter.outputs.description }}

runs:
    using: composite
    steps:
        # A pull request compares with its base through the GitHub API and ignores `base`, so once it touches the image,
        # every later push rebuilds pr-<N>. A push to main compares with the previous push, which for a merge commit
        # covers the whole pull request.
        - name: Detect changes
          id: filter
          uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
          with:
              base: main
              predicate-quantifier: some-with-excludes
              filters: |
                  image:
                      - src/**
                      - "!src/**/*.spec.ts"
                      - .docker/healthcheck.js
                      - package.json
                      - pnpm-lock.yaml
                      - pnpm-workspace.yaml
                      - nest-cli.json
                      - .swcrc
                      - tsconfig*.json
                      - Dockerfile
                      - .dockerignore
                      - docker-bake.hcl
                      - .github/actions/docker/**
                      - .github/actions/changes/**
                      - ${{ inputs.workflow }}
                  description:
                      - .docker/README.md
                      - .docker/short-description.txt
