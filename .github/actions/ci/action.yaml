name: CI checks
description: Installs dependencies, checks formatting, lints workflows, the Dockerfile, Markdown, and code, checks the size of the Docker Hub description, type checks, builds, and tests

runs:
    using: composite
    steps:
        - name: Set up Node.js and pnpm and install dependencies
          uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
          with:
              cache: true
              runtime: node
              require-lockfile: true

        - name: Check formatting
          shell: bash
          run: pnpm run format-check

        - name: Lint workflows
          uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2.2.0
          with:
              version: 1.7.12
              pyflakes: false

        - name: Lint Dockerfile
          shell: bash
          run: pnpm run lint-docker

        - name: Lint Markdown
          shell: bash
          run: pnpm run lint-md

        # Docker Hub limits the short description to 100 bytes and the overview to 25,000 bytes. The sync truncates
        # longer text with only a warning in the log, so the check fails here instead. The sync drops the final newline
        # of the short description, so the check does too.
        - name: Check the size of the Docker Hub description
          shell: bash
          run: |
              check_size() {
                  local file=$1 bytes=$2 limit=$3
                  if ((bytes > limit)); then
                      echo "::error file=$file::$file is $bytes bytes, more than the $limit that Docker Hub allows."
                      status=1
                  fi
              }

              short_description=$(< .docker/short-description.txt)
              status=0
              check_size .docker/short-description.txt "$(printf '%s' "$short_description" | wc --bytes)" 100
              check_size .docker/README.md "$(wc --bytes < .docker/README.md)" 25000
              exit "$status"

        - name: Lint code
          shell: bash
          run: pnpm run lint-ts

        - name: Type check
          shell: bash
          run: pnpm run typecheck

        - name: Build
          shell: bash
          run: pnpm run build

        - name: Test
          shell: bash
          run: pnpm run test-ci
