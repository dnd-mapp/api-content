name: Docker image
description: Builds the image for both platforms with Bake and pushes it to Docker Hub, tagged for the event

inputs:
    username:
        description: The Docker Hub account to log in with, which is also the namespace of the image
        required: true
    password:
        description: A personal access token of the account with the write scope
        required: true

outputs:
    digest:
        description: The digest of the image index that the action pushed
        value: ${{ steps.digest.outputs.digest }}

runs:
    using: composite
    steps:
        - name: Set up Docker Buildx
          uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

        - name: Log in to Docker Hub
          uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
          with:
              username: ${{ inputs.username }}
              password: ${{ inputs.password }}

        # Tags a pull request as pr-<N>, a push to main as edge and sha-<short-sha>, and a release as X.Y.Z, X.Y, and
        # latest, plus X from 1.0.0 on, since any 0.x release may break the API.
        - name: Generate the image metadata
          id: meta
          uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
          with:
              images: ${{ inputs.username }}/api-content
              tags: |
                  type=ref,event=pr
                  type=edge
                  type=sha,enable={{is_default_branch}}
                  type=semver,pattern={{version}}
                  type=semver,pattern={{major}}.{{minor}}
                  type=semver,pattern={{major}},enable=${{ !startsWith(github.ref, 'refs/tags/v0.') }}
          env:
              DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index

        # Builds from the checkout of the job rather than from the Git context of the event.
        - name: Build and push the image
          id: bake
          uses: docker/bake-action@018cb6412ab401ebaa809aa5f85966b74628600f # v7.4.0
          with:
              source: .
              files: |
                  ./docker-bake.hcl
                  ${{ steps.meta.outputs.bake-file-tags }}
                  ${{ steps.meta.outputs.bake-file-labels }}
                  ${{ steps.meta.outputs.bake-file-annotations }}
              targets: ci
              push: true

        # The runner evaluates the outputs of the action again after the post steps, when the outputs of the steps are
        # empty, so parsing the metadata in the output itself fails the job. Bake keys the metadata by the name of the
        # target, and --exit-status fails the step when the digest is missing.
        - name: Read the digest of the image
          id: digest
          shell: bash
          run: |
              digest=$(jq --exit-status --raw-output '.ci["containerimage.digest"]' <<< "$METADATA")
              echo "digest=$digest" >> "$GITHUB_OUTPUT"
          env:
              METADATA: ${{ steps.bake.outputs.metadata }}
